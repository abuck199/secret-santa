<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />

    <!-- Primary meta -->
    <title>ThatWish - Shared wishlists for birthdays & every occasion</title>
    <meta
      name="description"
      content="ThatWish lets your family or group share wishlists for birthdays and any occasion, then quietly reserve gifts so there are never duplicates and never any ruined surprises."
    />
    <link rel="canonical" href="https://thatwish.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThatWish" />
    <meta property="og:title" content="ThatWish - Shared wishlists, zero duplicate gifts" />
    <meta
      property="og:description"
      content="Share wishlists for birthdays and any occasion, and reserve gifts without spoiling the surprise."
    />
    <meta property="og:url" content="https://thatwish.com/" />
    <meta property="og:image" content="https://thatwish.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ThatWish - shared wishlists for birthdays and every occasion" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThatWish - Shared wishlists, zero duplicate gifts" />
    <meta
      name="twitter:description"
      content="Share wishlists for birthdays and any occasion, and reserve gifts without spoiling the surprise."
    />
    <meta name="twitter:image" content="https://thatwish.com/og-image.png" />

    <!-- Fonts are self-hosted via @fontsource (imported in src/main.jsx) -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
